<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skein – palettes from the threads you own</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#15171b;--panel:#1e2126;--panel2:#272b32;--ink:#eceef2;--ink2:#a3aab6;--line:#343944;--accent:#ff6f8e;--on-accent:#1b0a10;--shadow:0 6px 24px rgba(0,0,0,.35)}
[data-theme=mid]{--bg:#7f858e;--panel:#8c929b;--panel2:#9ba1aa;--ink:#101218;--ink2:#262a33;--line:#656b75;--accent:#c92652;--on-accent:#fff;--shadow:0 6px 24px rgba(0,0,0,.22)}
[data-theme=light]{--bg:#eceef1;--panel:#fff;--panel2:#f2f3f6;--ink:#14161b;--ink2:#566070;--line:#d6dae1;--accent:#cf2a58;--on-accent:#fff;--shadow:0 6px 24px rgba(20,30,50,.10)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
/* header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 0}
.brand{display:flex;align-items:baseline;gap:12px;margin-right:auto}
.brand h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
.brand p{color:var(--ink2);font-size:14px}
.btn{min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn.ghost{background:transparent}
.dirty{display:none;align-items:center;gap:8px;font-size:14px;font-weight:600}
.dirty.on{display:inline-flex}
.dirty i{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.themes{display:flex;gap:6px;padding:4px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.themes button{width:38px;height:38px;border-radius:50%;border:2px solid transparent}
.themes button[aria-pressed=true]{border-color:var(--accent)}
.themes [data-t=dark]{background:#15171b}.themes [data-t=mid]{background:#80868e}.themes [data-t=light]{background:#eceef1}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:600}
.chip[aria-pressed=true],.chip.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.7;margin-left:4px;font-weight:500}
.typebar{padding:0 0 12px}
.typebar .lbl{color:var(--ink2);font-size:14px;margin-right:4px}
.tabs{display:flex;gap:4px}
.tabs button{min-height:46px;padding:0 20px;border:0;background:transparent;font-weight:700;color:var(--ink2);border-bottom:3px solid transparent}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding:22px 0 40px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.panel h2{font-size:18px;font-weight:700;margin-bottom:12px}
.hint{color:var(--ink2);font-size:14px}
.empty{padding:40px 24px;text-align:center}
.empty h2{font-size:22px;margin-bottom:8px}
.empty p{color:var(--ink2);max-width:46ch;margin:0 auto 18px}
/* generate */
.gen{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
@media(max-width:920px){.gen{grid-template-columns:1fr}}
.ctrl{display:flex;flex-direction:column;gap:20px}
.field>label,.field>.fl{display:block;font-weight:700;margin-bottom:8px}
input[type=range]{width:100%;height:44px;accent-color:var(--accent)}
.rangeline{display:flex;align-items:center;gap:12px}
.rangeline output{min-width:28px;font-weight:800;font-size:22px;text-align:right}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;min-height:44px;border:0;background:var(--panel2);font-weight:600;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.switch{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:12px}
.switch input{appearance:none;width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;transition:.15s;flex:none;border:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:25px}
.bstrip{display:flex;flex-wrap:wrap;gap:8px;max-height:210px;overflow:auto;padding:2px}
.btile{width:46px;height:46px;border-radius:12px;border:2px solid var(--line);padding:0;position:relative;overflow:hidden}
.btile{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.btile.ex::after{content:"";position:absolute;inset:0;z-index:2;background:
 linear-gradient(to top right,transparent calc(50% - 2.5px),#e0173c calc(50% - 2.5px),#e0173c calc(50% + 2.5px),transparent calc(50% + 2.5px)),
 linear-gradient(to bottom right,transparent calc(50% - 2.5px),#e0173c calc(50% - 2.5px),#e0173c calc(50% + 2.5px),transparent calc(50% + 2.5px)),
 linear-gradient(to top right,transparent calc(50% - 4.5px),#fff calc(50% - 4.5px),#fff calc(50% + 4.5px),transparent calc(50% + 4.5px)),
 linear-gradient(to bottom right,transparent calc(50% - 4.5px),#fff calc(50% - 4.5px),#fff calc(50% + 4.5px),transparent calc(50% + 4.5px))}
.btile.ex{opacity:.75}
.btile.rand{width:auto;padding:0 14px;background:var(--panel2);font-weight:700}
.btile.sel{outline:3px solid var(--accent);outline-offset:1px}
.go{width:100%;min-height:58px;font-size:18px;font-weight:800;border-radius:14px}
/* palette cards */
.hrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.hrow .chip{padding:0 8px;white-space:normal;line-height:1.2;text-align:center}
@media(max-width:520px){.hrow{grid-template-columns:repeat(2,minmax(0,1fr))}}
.results{display:flex;flex-direction:column;gap:20px;min-width:0}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.pcard>header{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.pcard h3{font-size:20px;font-weight:800;letter-spacing:-.01em}
.pcard .sub{color:var(--ink2);font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.bands{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:12px}
@media(max-width:620px){.bands{grid-auto-flow:row;grid-auto-columns:auto}.band{height:90px!important}}
.slot{margin:0;min-width:0}
.band{position:relative;height:165px;border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.band::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,rgba(255,255,255,.14) 0 3px,rgba(0,0,0,.10) 3px 6px);mix-blend-mode:soft-light}
.band::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.20),rgba(255,255,255,.18) 28%,rgba(255,255,255,0) 52%,rgba(0,0,0,.24))}
.band.metal::after{background:linear-gradient(90deg,rgba(0,0,0,.2),rgba(255,255,255,.35) 22%,rgba(255,255,255,0) 38%,rgba(255,255,255,.28) 62%,rgba(0,0,0,.25))}
.band .pin{position:absolute;left:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.6);z-index:2}
.band .num{position:absolute;left:8px;bottom:8px;z-index:2;min-width:26px;height:26px;padding:0 7px;display:grid;place-items:center;font-size:13px;font-weight:800;border-radius:999px;background:rgba(0,0,0,.7);color:#fff}
.band .tag{position:absolute;left:8px;top:8px;z-index:2;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.88);color:#111}
.slot figcaption{padding-top:10px;font-size:14px;line-height:1.35}
.slot figcaption b{display:block;font-size:16px}
.slot .nm{display:block;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .nt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;font-style:italic;font-size:13px;color:var(--ink2);margin-top:4px}
.slot .q{display:block;font-size:13px;font-weight:600;margin-top:2px}
.alts{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.alt{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px 2px 3px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.alt i{width:14px;height:14px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.note-line{margin-top:12px;font-size:14px;color:var(--ink2)}
/* preview */
.prevhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
#svgHost{background:var(--panel2);border-radius:12px;padding:12px;display:flex;justify-content:center;min-height:120px}
#svgHost svg{width:100%;height:auto;max-height:480px}
/* stash */
.stash{display:grid;grid-template-columns:1fr 1.15fr;gap:20px;align-items:start}
@media(max-width:920px){.stash{grid-template-columns:1fr}}
.typeadmin{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px}
.typeadmin input[type=text]{flex:1 1 200px}
input[type=text],input[type=search],select,textarea{min-height:44px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);width:100%}
input[type=color]{width:56px;height:44px;padding:2px;border-radius:10px;border:1px solid var(--line);background:var(--panel2)}
.ownedlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;max-height:70vh;overflow:auto}
.own{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.own .sw{width:54px;height:54px;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.own .meta b{margin-right:6px}
.own .meta{min-width:0}
.own input.note{margin-top:6px;min-height:38px;font-size:14px;background:var(--panel)}
.own .ctl{display:flex;gap:6px;align-self:start}
.own .x{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.own .x:disabled{opacity:.35;cursor:default}
.browsebar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.browsebar .full{grid-column:1/-1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;max-height:60vh;overflow:auto;padding:2px}
.tile{display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);text-align:left;position:relative;min-height:44px}
.tile .sw{display:block;height:44px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.tile b{font-size:13px}
.tile small{font-size:11.5px;line-height:1.2;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.4em}
.tile.on{border-color:var(--accent)}
.tile.on::after{content:"✓";position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:13px;font-weight:800}
details.cust{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
details.cust summary{min-height:44px;display:flex;align-items:center;font-weight:700;cursor:pointer}
.cform{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.cform .full{grid-column:1/-1}
.cform label{font-size:13px;font-weight:600;display:block;margin-bottom:4px}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:10px;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:20px}
@media(max-width:520px){.cgrid{grid-template-columns:1fr}}
.foot{border-top:1px solid var(--line);padding:22px 20px 40px;text-align:center;color:var(--ink2);font-size:14px;display:flex;flex-direction:column;gap:6px}
.foot a{color:var(--ink);font-weight:700;text-underline-offset:3px}
/* dialog + toast */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);width:min(560px,92vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog textarea{min-height:260px;font:500 14px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
dialog .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:600;transition:.2s;z-index:50;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="row">
    <div class="brand"><h1>Skein</h1><p>Palettes from the threads you own</p></div>
    <span class="dirty" id="dirty"><i></i>Unsaved changes</span>
    <div class="themes" role="group" aria-label="Background"></div>
    <button class="btn" data-act="load">Load stash</button>
    <button class="btn" id="saveBtn" data-act="save">Save stash</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
    <input type="file" id="svgIn" accept=".svg,image/svg+xml" hidden>
  </div>
  <div class="row typebar"><div class="chips" id="typeChips"></div></div>
  <nav class="tabs" role="tablist"></nav>
</div></header>
<main class="wrap" id="view"></main>
<footer class="foot wrap">
  <p>Skein is free, and part of the <a href="https://github.com/SavarosaCraft/Crafting-Toolbox" target="_blank" rel="noopener noreferrer">Crafting Toolbox</a> by Savarosa Craft. Find the code on <a href="https://github.com/SavarosaCraft/Crafting-Toolbox" target="_blank" rel="noopener noreferrer">GitHub</a>.</p>
  <p>If it helped you pick a palette you love, you can <a href="https://ko-fi.com/savarosacraft" target="_blank" rel="noopener noreferrer">buy me a coffee on Ko-fi</a> ☕. Thank you, and happy stitching!</p>
</footer>
<dialog id="dlg"><h2 id="dlgT" style="margin:0 0 10px;font-size:18px"></h2><textarea id="dlgTx" readonly></textarea>
  <div class="row"><button class="btn" data-act="dlgCopy">Copy</button><button class="btn" data-act="dlgSave">Save .txt</button><button class="btn pri" data-act="dlgClose">Close</button></div></dialog>
<div id="toast" role="status"></div>

<script>

const rgb2hex=(r,g,b)=>'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');
const lin=v=>{v/=255;return v<=.04045?v/12.92:((v+.055)/1.055)**2.4};
function rgb2lab([r,g,b]){const R=lin(r),G=lin(g),B=lin(b);
  const x=(R*.4124564+G*.3575761+B*.1804375)/.95047,y=R*.2126729+G*.7151522+B*.072175,z=(R*.0193339+G*.119192+B*.9503041)/1.08883;

const lab2lch=([L,a,b])=>[L,Math.hypot(a,b),(Math.atan2(b,a)*180/Math.PI+360)%360];
function dE(l1,l2){ // CIEDE2000

function sampleStops(st,t){const last=st[st.length-1];if(t<=st[0].p)return st[0].hex;if(t>=last.p)return last.hex;
  for(let i=1;i<st.length;i++)if(t<=st[i].p){const a=st[i-1],b=st[i],k=(t-a.p)/((b.p-a.p)||1),A=hex2rgb(a.hex),B=hex2rgb(b.hex);return rgb2hex(...A.map((v,j)=>v+(B[j]-v)*k))}}
const parseStops=s=>s.split(',').map(x=>{const[p,h]=x.split(':');return{p:+p,hex:h}}).sort((a,b)=>a.p-b.p);
const cssGrad=(st,dir='to bottom')=>`linear-gradient(${dir},${st.map(s=>`${s.hex} ${s.p}%`).join(',')})`;

/* ---------- catalog + threads ---------- */
const DMC_S=new Map(DMC.solidColors.map(o=>[o.id,o])), DMC_G=new Map(DMC.gradients.map(o=>[o.id,o]));
const TC=new Map();
function mkThread(o){const t={...o};
  if(o.stops){t.grad=true;t.samples=[...Array(12)].map((_,i)=>{const p=i*100/11,hex=sampleStops(o.stops,p);return{p,hex,lab:hex2lab(hex)}});
    const avg=[0,1,2].map(j=>t.samples.reduce((a,s)=>a+hex2rgb(s.hex)[j],0)/12);t.hex=rgb2hex(...avg)}
  else t.samples=[{p:50,hex:o.hex,lab:hex2lab(o.hex)}];
  t.lab=hex2lab(t.hex);t.fill=t.grad?cssGrad(t.stops):t.hex;return t}
function getThread(key){if(TC.has(key))return TC.get(key);let t=null;
  if(key.startsWith('dmc:')){const o=DMC_S.get(key.slice(4));if(o)t=mkThread({key,brand:'DMC',code:o.id,name:o.name,group:o.group,hex:o.hex,metallic:o.group==='Metallic Solids'})}
  else if(key.startsWith('dmcg:')){const o=DMC_G.get(key.slice(5));if(o)t=mkThread({key,brand:'DMC',code:o.id,name:o.name,group:o.group+' (gradient)',stops:parseStops(o.stops),metallic:o.group==='Metallic'})}
  else if(key.startsWith('c:')){const o=S.custom.find(c=>c.id===key.slice(2));if(o){const h=o.hexes;
    t=mkThread({key,brand:o.brand||'',code:o.code||'',name:o.name||'',group:'My custom',custom:true,metallic:!!o.metallic,...(h.length>1?{stops:h.map((x,i)=>({p:i*100/(h.length-1),hex:x}))}:{hex:h[0]})})}}
  if(t)TC.set(key,t);return t}
const label=t=>[t.brand,t.code].filter(Boolean).join(' ')||t.name;

/* ---------- state ---------- */
let S={types:[],custom:[],favorites:[],svg:null,theme:'dark'};
let ui={tab:'gen',typeId:null,pal:null,jpgPrev:true,browse:{src:'dmc',group:'all',q:''},cStops:2,result:null,
  sel:'complementary',gen:{count:5,baseKey:'',gmode:'avg',grad:true,metal:true}};
let dirty=false;const REG=new Map();
const curType=()=>S.types.find(t=>t.id===ui.typeId)||S.types[0]||null;
const ownedList=t=>t?t.threads.map(e=>getThread(e.key)).filter(Boolean):[];
function mark(){dirty=true;chrome()}

/* ---------- harmony + generation ---------- */
const HARM={complementary:{name:'Complementary',off:[0,180]},analogous:{name:'Analogous'},triadic:{name:'Triadic',off:[0,120,240]},
  split:{name:'Split-complementary',off:[0,150,210]},tetradic:{name:'Tetradic (square)',off:[0,90,180,270]},
  rectangle:{name:'Rectangle',off:[0,60,180,240]},mono:{name:'Monochromatic',off:[0]}};
const NEAR=6;
const meanHue=t=>{let x=0,y=0;t.samples.forEach(s=>{x+=s.lab[1];y+=s.lab[2]});return(Math.atan2(y,x)*180/Math.PI+360)%360};
function makeTargets(hk,n,base,gmode,bal){
  const[bL,bC,bH]=lab2lch(base.lab),neutral=bC<10,m=n-1,mono=hk==='mono';
  const H0=(gmode==='anchor'&&base.grad&&bC>=6)?meanHue(base):neutral?rnd(0,360):bH;
  let offs;
  if(hk==='analogous')offs=[25,-25,50,-50,75,-75,12,-12].slice(0,m);
  else{const a=HARM[hk].off,k=a.length;offs=[...Array(m)].map((_,j)=>{const i=j+1,r=Math.floor(i/k);return a[i%k]+(r?(r%2?1:-1)*8*r:0)})}
  const Ls=bal?(m===1?[bL>55?rnd(18,36):rnd(76,90)]:shuffle(linspace(18,90,m))):[...Array(m)].map(()=>clamp(bL+rnd(-24,24),14,93));
  return offs.map((o,i)=>{const C=mono?bC*rnd(.8,1.15):neutral?rnd(26,50):clamp(bC*rnd(.75,1.2),14,75),h=(H0+o+360)%360*Math.PI/180;
    return[Ls[i],C*Math.cos(h),C*Math.sin(h)]})}
function buildSlots(pool,base,hk,n,gmode,bal){

  const claim=t=>{const a=[];for(const c of pool)if(!claimed.has(c.key)&&dE(t.lab,c.lab)<NEAR){claimed.add(c.key);a.push(c.key)}return a};
  const slots=[{key:base.key,de:0,alts:claim(base),base:true}];
  for(const tg of makeTargets(hk,n,base,gmode,bal)){let best=null;
    for(const c of pool){if(claimed.has(c.key))continue;let d,p=null;
      if(gmode==='range'&&c.grad){d=1e9;for(const s of c.samples){const x=dE(tg,s.lab);if(x<d){d=x;p=s.p}}}else d=dE(tg,c.lab);
      if(!best||d<best.d)best={c,d,p}}
    if(!best)break;claimed.add(best.c.key);slots.push({key:best.c.key,de:best.d,match:best.p,alts:claim(best.c)})}

function generate(){
  const type=curType(),exs=new Set(type.excluded||[]),owned=ownedList(type).filter(t=>!exs.has(t.key)),g=ui.gen;
  if(owned.length<2){toast('You need at least 2 threads that are not excluded in this yarn type.');return}
  const n=g.count;let gmode=g.gmode;
  const pool=owned.filter(t=>(g.grad||!t.grad)&&(g.metal||!t.metallic));
  let base=g.baseKey?owned.find(t=>t.key===g.baseKey):null;
  if(!base){const cand=gmode==='anchor'?owned.filter(t=>t.grad):pool;base=pick(cand.length?cand:(pool.length?pool:owned))}
  let note='';
  if(gmode==='anchor'&&!base.grad){gmode='range';note='The base is not a gradient thread, so "Any shade" matching was used instead of anchoring.'}
  let p2=pool.filter(t=>t.key!==base.key);
  if(gmode==='anchor'){const solids=p2.filter(t=>!t.grad);if(solids.length>=n-1)p2=solids}
  const pals={};
  for(const hk of Object.keys(HARM))pals[hk]={id:'p'+uid(),typeId:type.id,hk,harmony:HARM[hk].name,variant:'bal',gmode,slots:buildSlots(p2,base,hk,n,gmode,true)};
  if(!pals[ui.sel])ui.sel='complementary';
  ui.result={pals,n,note,baseKey:base.key};ui.pal=pals[ui.sel];renderResults();
  $('#results')?.scrollIntoView({behavior:'smooth',block:'start'})}

/* ---------- palette rendering ---------- */
const noteOf=(p,key)=>{const ty=S.types.find(x=>x.id===p.typeId),e=ty&&ty.threads.find(x=>x.key===key);return(e&&e.note||'').trim()};
const qual=d=>d<2?'Exact match':d<5?'Very close':d<10?'Close match':'Loose match';
const sig=p=>p.typeId+'|'+p.variant+'|'+p.slots.map(s=>s.key).join(',');
const isFav=p=>S.favorites.some(f=>sig(f)===sig(p));
function paletteCard(p){REG.set(p.id,p);
  const type=S.types.find(t=>t.id===p.typeId),fav=isFav(p);
  const slots=p.slots.map(s=>({s,t:getThread(s.key)})).filter(x=>x.t);
  const lights=slots.map(x=>x.t.lab[0]),mix=Math.min(...lights)<35&&Math.max(...lights)>75;
  return`<article class="pcard" data-pid="${p.id}"><header><div><h3>${esc(p.harmony)}</h3>
    <p class="sub">${slots.length===2?'Pair: your base plus its '+esc(p.harmony.split(' (')[0].toLowerCase())+' partner · ':''}${p.variant==='pure'?'True harmony · ':''}${esc(type?type.name:'')} · ${slots.length===2?'':slots.length+' threads'}${mix?(slots.length===2?'':' · ')+'includes light and dark threads':''}</p></div>
    <div class="acts"><button class="btn sm ${fav?'on':''}" data-act="star" data-pid="${p.id}" aria-pressed="${fav}">${fav?'★ Saved':'☆ Save'}</button>
    <button class="btn sm" data-act="mix" data-pid="${p.id}">⇄ Mix colors</button>${ui.tab==='saved'?`<button class="btn sm" data-act="prev" data-pid="${p.id}">Preview</button>`:''}
    <button class="btn sm" data-act="list" data-pid="${p.id}">Text list</button>
    <button class="btn sm" data-act="jpg" data-pid="${p.id}">JPG</button></div></header>
    <div class="bands">${slots.map(({s,t})=>{
      const pin=(p.gmode==='range'&&t.grad&&s.match!=null)?`<span class="pin" style="top:${s.match}%;background:${t.samples.reduce((b,x)=>Math.abs(x.p-s.match)<Math.abs(b.p-s.match)?x:b).hex}"></span>`:'';
      const alts=(s.alts||[]).map(getThread).filter(Boolean).slice(0,4);
      return`<figure class="slot"><div class="band ${t.metallic?'metal':''}" style="background:${t.fill}">${s.base?'<span class="tag">base</span>':''}<span class="num">${slots.findIndex(x=>x.s===s)+1}</span>${pin}</div>
      <figcaption><b>${esc(label(t))}</b><span class="nm" title="${esc(t.name)}">${esc(t.name)}${t.grad?' · gradient':''}${t.metallic?' · metallic':''}</span>
      <span class="q">${s.base?'Your starting thread':qual(s.de)}</span>${noteOf(p,t.key)?`<span class="nt">${esc(noteOf(p,t.key))}</span>`:''}
      ${alts.length?`<div class="alts" title="Near-identical threads you also own">${alts.map(a=>`<span class="alt"><i style="background:${a.fill}"></i>${esc(label(a))}</span>`).join('')}</div>`:''}</figcaption></figure>`}).join('')}</div></article>`}

function ensureSvg(){return S.svg||SAMPLE_SVG}
function svgGroups(svg){const out=[],re=/^color[-_ ]?(\d+)$/i;
  svg.querySelectorAll('*').forEach(e=>{if(e.closest('defs'))return;let n=null;
    const dc=e.getAttribute('data-color');if(dc&&/^\d+$/.test(dc))n=+dc;
    if(!n)for(const v of [e.getAttribute('id'),e.getAttribute('inkscape:label')]){const m=v&&v.match(re);if(m){n=+m[1];break}}
    if(!n){const m=(e.getAttribute('class')||'').match(/(?:^|\s)color-?(\d+)(?:\s|$)/);if(m)n=+m[1]}
    if(n)out.push({e,n})});return out}
function svgColorCount(text){try{const d=new DOMParser().parseFromString(text,'image/svg+xml');return new Set(svgGroups(d.documentElement).map(x=>x.n)).size}catch(e){return 0}}
function paintSVG(text,p){

  svg.querySelectorAll('*').forEach(e=>[...e.attributes].forEach(a=>/^on/i.test(a.name)&&e.removeAttribute(a.name)));
  const th=p.slots.map(s=>getThread(s.key)).filter(Boolean);if(!th.length)return null;
  let VB=(svg.getAttribute('viewBox')||'').split(/[\s,]+/).map(Number);
  if(VB.length!==4||VB.some(isNaN))VB=[0,0,parseFloat(svg.getAttribute('width'))||400,parseFloat(svg.getAttribute('height'))||400];

  const fills=th.map((t,i)=>{if(!t.grad)return t.hex;const g=doc.createElementNS(NS,'linearGradient');g.setAttribute('id','skg'+i);g.setAttribute('gradientUnits','userSpaceOnUse');g.setAttribute('x1',VB[0]);g.setAttribute('y1',VB[1]);g.setAttribute('x2',VB[0]+VB[2]);g.setAttribute('y2',VB[1]+VB[3]);
    t.stops.forEach(s=>{const o=doc.createElementNS(NS,'stop');o.setAttribute('offset',s.p+'%');o.setAttribute('stop-color',s.hex);g.appendChild(o)});defs.appendChild(g);return`url(#skg${i})`});
  const apply=(e,idx)=>{const f=fills[idx%fills.length];e.querySelectorAll('*').forEach(c=>{if(c.localName!=='stop'&&c.localName!=='linearGradient'){c.removeAttribute('fill');c.style.removeProperty('fill')}});e.setAttribute('fill',f);e.style.fill=f};

  else{const order=[];svg.querySelectorAll('*').forEach(e=>{if(e.closest('defs'))return;let f=(e.getAttribute('fill')||(e.style&&e.style.fill)||'').trim().toLowerCase();if(!f||f==='none'||f.startsWith('url'))return;let i=order.indexOf(f);if(i<0){order.push(f);i=order.length-1}e.setAttribute('fill',fills[i%fills.length]);e.style.fill=fills[i%fills.length]})}

  svg.setAttribute('width',vb[2]);svg.setAttribute('height',vb[3]);if(!svg.getAttribute('xmlns'))svg.setAttribute('xmlns',NS);
  return new XMLSerializer().serializeToString(svg)}

function previewPanel(){const p=ui.pal,r=ui.result;
  let body='<p class="hint">Generate a palette (or pick one from Saved), then press Preview to see it on your design.</p>';
  if(p){const s=paintSVG(ensureSvg(),p);body=s||'<p class="hint">That SVG could not be read. Try another file or use the sample.</p>'}
  return`<section class="pcard"><div class="prevhead"><div><h3>Preview</h3><p class="sub">${p?esc(p.harmony):'No palette selected'}</p></div>
   <div class="acts">${p?`<button class="btn sm" data-act="mix" data-pid="${p.id}">⇄ Mix colors</button>`:''}
   <button class="btn sm" data-act="loadSvg">Load SVG</button>${S.svg?'<button class="btn sm" data-act="sample">Use sample</button>':''}</div></div>
   <div id="svgHost">${body}</div>
   <label class="chk"><input type="checkbox" data-in="jpgprev" ${ui.jpgPrev?'checked':''}> Include this preview in JPG exports</label>
   <p class="hint">Color shapes in your SVG by giving them ids <code>color-1</code>, <code>color-2</code>… (or <code>data-color="1"</code>, or Inkscape layer/group labels <code>color1</code>…). ${(()=>{const n=svgColorCount(ensureSvg());return n?`Your design has <b>${n}</b> color groups.`:''})()} Without ids, each distinct fill color is replaced in order.</p></section>`}

function harmonyRow(){const r=ui.result;
  return`<div class="hrow" role="tablist" aria-label="Harmony">${Object.entries(HARM).map(([k,v])=>`<button class="chip" role="tab" data-act="harm" data-k="${k}" aria-pressed="${ui.sel===k}" aria-selected="${ui.sel===k}" title="${v.name}">${{split:'Split-comp.',tetradic:'Tetradic'}[k]||v.name}</button>`).join('')}</div>`}
function renderResults(){const host=$('#results');if(!host)return;const r=ui.result;
  if(!r){host.innerHTML=`<div class="panel empty"><h2>Ready when you are</h2><p>Pick your base thread and options, then press Generate. All seven harmonies are built at once, so you can flip between them without generating again. Use Mix colors to reshuffle which thread goes on which color group.</p></div>${previewPanel()}`;return}
  const pal=r.pals[ui.sel],short=pal.slots.length<r.n;
  const note=[r.note,short?`Only ${pal.slots.length} distinct threads were available for this harmony (similar shades are grouped as alternates).`:''].filter(Boolean).join(' ');
  host.innerHTML=`${harmonyRow()}${note?`<div class="panel hint">${esc(note)}</div>`:''}${paletteCard(pal)}${previewPanel()}`}
function paletteText(p){const type=S.types.find(t=>t.id===p.typeId);
  const L=[`Skein palette – ${p.harmony}`,`Yarn: ${type?type.name:''}`,''];
  p.slots.forEach((s,i)=>{const t=getThread(s.key);if(!t)return;
    L.push(`${i+1}. ${label(t)} – ${t.name}${t.grad?' (gradient '+t.stops.map(x=>x.hex).join(' → ')+')':'  '+t.hex}${t.metallic?' [metallic]':''}${s.base?' [base]':''}`);
    const nt=noteOf(p,s.key);if(nt)L.push('   note: '+nt.replace(/\s+/g,' '));
    const a=(s.alts||[]).map(getThread).filter(Boolean);if(a.length)L.push('   also close: '+a.map(label).join(', '))});
  L.push('','Made with Skein · free to download on GitHub: https://github.com/SavarosaCraft/Crafting-Toolbox');
  return L.join('\n')}
function showText(title,text){$('#dlgT').textContent=title;$('#dlgTx').value=text;$('#dlg').showModal()}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}

function loadImg(svgStr){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgStr)})}
async function exportJPG(p){
  const th=p.slots.map(s=>({s,t:getThread(s.key)})).filter(x=>x.t);if(!th.length)return;
  const W=1200,pad=48,gap=16,n=th.length,bw=(W-pad*2-gap*(n-1))/n,bh=300,top=120;
  let img=null,ph=0;
  if(ui.jpgPrev){try{const s=paintSVG(ensureSvg(),p);if(s){img=await loadImg(s);ph=Math.min(680,(W-pad*2)*(img.height/img.width||1))}}catch(e){img=null}}
  const H=top+bh+220+(img?ph+60:0)+44;
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#f3f4f6';x.fillRect(0,0,W,H);
  x.fillStyle='#14161b';x.font='800 36px system-ui,sans-serif';x.fillText(p.harmony,pad,64);
  x.fillStyle='#566070';x.font='500 20px system-ui,sans-serif';const type=S.types.find(t=>t.id===p.typeId);
  x.fillText(type?type.name:'',pad,98);
  th.forEach(({s,t},i)=>{const bx=pad+i*(bw+gap),by=top;
    x.save();x.beginPath();x.roundRect(bx,by,bw,bh,16);x.clip();
    if(t.grad){const g=x.createLinearGradient(0,by,0,by+bh);t.stops.forEach(k=>g.addColorStop(k.p/100,k.hex));x.fillStyle=g}else x.fillStyle=t.hex;x.fillRect(bx,by,bw,bh);
    const sh=x.createLinearGradient(bx,0,bx+bw,0);sh.addColorStop(0,'rgba(0,0,0,.2)');sh.addColorStop(.3,'rgba(255,255,255,.18)');sh.addColorStop(.55,'rgba(255,255,255,0)');sh.addColorStop(1,'rgba(0,0,0,.24)');x.fillStyle=sh;x.fillRect(bx,by,bw,bh);x.restore();
    const wrap=(txt,w,max)=>{const words=txt.split(' '),lines=[];let cur='';
      for(const wd of words){const nx=cur?cur+' '+wd:wd;if(x.measureText(nx).width>w&&cur){lines.push(cur);cur=wd}else cur=nx}
      if(cur)lines.push(cur);if(lines.length>max){lines.length=max;let l=lines[max-1];while(l.length>2&&x.measureText(l+'…').width>w)l=l.slice(0,-1);lines[max-1]=l+'…'}return lines};
    x.fillStyle='#14161b';x.font='700 22px system-ui,sans-serif';x.fillText((i+1)+'. '+label(t),bx,by+bh+34);
    x.fillStyle='#566070';x.font='500 17px system-ui,sans-serif';let ly=by+bh+60;
    wrap(t.name+(t.grad?' (gradient)':''),bw,2).forEach(l=>{x.fillText(l,bx,ly);ly+=22});
    const nt=noteOf(p,s.key);if(nt){x.fillStyle='#14161b';x.font='italic 500 15px system-ui,sans-serif';ly+=2;wrap(nt,bw,2).forEach(l=>{x.fillText(l,bx,ly);ly+=19})}
    x.fillStyle='#566070';
    const a=(s.alts||[]).map(getThread).filter(Boolean).map(label).join(', ');
    if(a){x.font='500 14px system-ui,sans-serif';ly+=4;wrap('also: '+a,bw,2).forEach(l=>{x.fillText(l,bx,ly);ly+=18})}});
  if(img){const pw=Math.min(W-pad*2,ph*(img.width/img.height||1)),px=(W-pw)/2,py=top+bh+220;x.fillStyle='#fff';x.beginPath();x.roundRect(pad,py-10,W-pad*2,ph+20,16);x.fill();x.drawImage(img,px,py,pw,ph)}
  x.fillStyle='#d6dae1';x.fillRect(pad,H-52,W-pad*2,1);
  x.fillStyle='#8a92a0';x.font='500 15px system-ui,sans-serif';x.textAlign='right';
  x.fillText('Made with Skein  ·  free to download on GitHub: github.com/SavarosaCraft/Crafting-Toolbox',W-pad,H-24);x.textAlign='left';
  c.toBlob(b=>{download(b,'skein-palette.jpg');toast('JPG saved')},'image/jpeg',.92)}

/* ---------- views ---------- */
function viewGen(){const type=curType();
  if(!type)return`<div class="panel empty"><h2>Start with a yarn type</h2><p>Create a yarn type like "Size 10", then tick the threads you own.</p><button class="btn pri" data-act="tab" data-v="stash">Set up my threads</button></div>`;
  const owned=ownedList(type),g=ui.gen,exs=new Set(type.excluded||[]);
  const gdesc={avg:'Each gradient counts as its average color.',range:'A gradient matches if any shade along it fits (a dot marks the shade).',anchor:'A gradient thread is the base. Its hue sets the palette and solids fill in around it.'};
  return`<div class="gen"><div class="panel ctrl">
   <button class="btn pri go" data-act="gen">Generate palette</button>
   <div class="field"><label for="cnt">Number of colors</label><div class="rangeline"><input id="cnt" type="range" min="2" max="8" value="${g.count}" data-in="count"><output id="cntV">${g.count}</output></div></div>
   <div class="field"><span class="fl">Base thread</span><div class="bstrip"><button class="btile rand ${g.baseKey?'':'sel'}" data-act="base" data-key="">Random</button>${owned.map(t=>`<button class="btile ${g.baseKey===t.key?'sel':''} ${exs.has(t.key)?'ex':''}" data-act="base" data-key="${esc(t.key)}" style="background:${t.fill}" title="${esc(label(t)+' '+t.name)}" aria-label="${esc(label(t)+' '+t.name+(exs.has(t.key)?' (excluded)':''))}"></button>`).join('')}</div>
   <p class="hint" style="margin-top:8px">Tap to choose a base. <b>Double-tap</b> a thread to exclude it (crossed out); double-tap again to include it.</p><p class="hint" id="exInfo">${exInfo(type)}</p>
   ${owned.length-exs.size<2?'<p class="hint" style="margin-top:4px">You need at least 2 available threads in this type to generate.</p>':''}</div>
   <div class="field"><span class="fl">Gradient threads</span><div class="seg">${[['avg','Average'],['range','Any shade'],['anchor','Anchor']].map(([k,n])=>`<button data-act="gmode" data-k="${k}" aria-pressed="${g.gmode===k}">${n}</button>`).join('')}</div><p class="hint" style="margin-top:6px">${gdesc[g.gmode]}</p></div>
   <div><label class="switch"><span>Include gradient threads</span><input type="checkbox" data-in="grad" ${g.grad?'checked':''}></label>
   <label class="switch"><span>Include metallic threads</span><input type="checkbox" data-in="metal" ${g.metal?'checked':''}></label></div></div>
   <div class="results" id="results"></div></div>`}

function viewSaved(){const favs=S.favorites.filter(f=>S.types.some(t=>t.id===f.typeId));
  return`${favs.length?`<div class="cgrid">${favs.map(paletteCard).join('')}</div><div style="margin-top:20px">${previewPanel()}</div>`:`<div class="panel empty"><h2>No saved palettes yet</h2><p>Press Save on any generated palette and it will be kept in your stash file.</p></div>`}`}

function viewStash(){const type=curType();
  const admin=`<div class="typeadmin"><input type="text" id="newType" placeholder="New yarn type, e.g. Size 10" maxlength="40"><button class="btn pri" data-act="addType">Add yarn type</button>
   ${type?`<button class="btn" data-act="renameType">Rename “${esc(type.name)}”</button>${S.types.length>1?`<button class="btn" data-act="moveType" data-d="-1" ${S.types.indexOf(type)===0?'disabled':''} aria-label="Move ${esc(type.name)} earlier">◀ Move earlier</button><button class="btn" data-act="moveType" data-d="1" ${S.types.indexOf(type)===S.types.length-1?'disabled':''} aria-label="Move ${esc(type.name)} later">Move later ▶</button>`:''}<button class="btn ghost" data-act="delType">Delete</button>`:''}</div>`;
  if(!type)return`<div class="panel empty"><h2>Name your first yarn type</h2><p>Yarn types separate what you own by size or weight, for example “Size 10” or “Size 20”.</p>${admin}</div>`;
  const b=ui.browse,groups=[...new Set((b.src==='dmc'?DMC.solidColors:DMC.gradients).map(o=>o.group))];
  return`${admin}<div class="stash"><section class="panel"><h2>Owned in “${esc(type.name)}” <span class="hint" id="ownCount"></span></h2><ul class="ownedlist" id="ownedList"></ul></section>
   <section class="panel"><h2>Add threads</h2><div class="seg">${[['dmc','DMC solids'],['dmcg','DMC gradients'],['cus','My custom']].map(([k,n])=>`<button data-act="src" data-k="${k}" aria-pressed="${b.src===k}">${n}</button>`).join('')}</div>
   <div class="browsebar"><input type="search" id="q" placeholder="Search number or name" value="${esc(b.q)}">${b.src==='cus'?'<span></span>':`<select id="grp" aria-label="Group"><option value="all">All groups</option>${groups.map(g=>`<option ${b.group===g?'selected':''}>${esc(g)}</option>`).join('')}</select>`}</div>
   <div class="grid" id="grid"></div>
   <details class="cust"><summary>Add a custom thread</summary><div class="cform">
    <div><label for="cBrand">Brand</label><input type="text" id="cBrand" placeholder="e.g. Anchor, hand-dyed"></div><div><label for="cCode">Number / code</label><input type="text" id="cCode"></div>
    <div class="full"><label for="cName">Name</label><input type="text" id="cName"></div>
    <div><label for="cKind">Type</label><select id="cKind"><option value="solid">Solid color</option><option value="grad">Gradient</option></select></div>
    <div id="cStopsW" style="display:none"><label for="cStops">Color stops</label><select id="cStops"><option>2</option><option>3</option><option>4</option></select></div>
    <div class="full"><label>Color${'' }</label><div class="colors" id="cColors">${['#d94f6b','#f2b84b','#4fa3d9','#6bbf7a'].map((c,i)=>`<input type="color" id="cC${i}" value="${c}" ${i?'style="display:none"':''} aria-label="Color ${i+1}">`).join('')}</div></div>
    <label class="chk full"><input type="checkbox" id="cMetal"> Metallic thread</label>
    <div class="full"><label for="cNote">Note (optional)</label><input type="text" id="cNote" placeholder="e.g. 2 skeins left"></div>
    <button class="btn pri full" data-act="addCustom">Add to “${esc(type.name)}”</button></div></details></section></div>`}

function browseKeys(){const b=ui.browse,q=b.q.trim().toLowerCase();let keys;
  if(b.src==='dmc')keys=DMC.solidColors.map(o=>'dmc:'+o.id);else if(b.src==='dmcg')keys=DMC.gradients.map(o=>'dmcg:'+o.id);else keys=S.custom.map(c=>'c:'+c.id);
  return keys.map(getThread).filter(t=>t&&(b.src==='cus'||b.group==='all'||t.group.replace(' (gradient)','')===b.group)&&(!q||(t.code+' '+t.name).toLowerCase().includes(q)))}
function renderGrid(){const g=$('#grid');if(!g)return;const type=curType(),own=new Set(type.threads.map(e=>e.key));const items=browseKeys();
  g.innerHTML=items.length?items.map(t=>`<button class="tile ${own.has(t.key)?'on':''}" data-act="toggle" data-key="${esc(t.key)}" aria-pressed="${own.has(t.key)}"><span class="sw" style="background:${t.fill}"></span><b>${esc(label(t))}</b><small>${esc(t.name)}</small></button>`).join(''):'<p class="hint">Nothing matches. Custom threads you create appear here.</p>'}
function renderOwned(){const l=$('#ownedList'),type=curType();if(!l)return;
  l.innerHTML=type.threads.length?type.threads.map((e,idx)=>{const t=getThread(e.key);if(!t)return'';const last=type.threads.length-1;
    return`<li class="own"><span class="sw" style="background:${t.fill}"></span><div class="meta"><b>${esc(label(t))}</b>${esc(t.name)}<span class="hint">${t.grad?' · gradient':''}${t.metallic?' · metallic':''}</span>
    <input class="note" type="text" data-note="${esc(e.key)}" placeholder="Add a note" value="${esc(e.note||'')}" aria-label="Note for ${esc(label(t))}"></div>
    <div class="ctl"><button class="x" data-act="moveThread" data-d="-1" data-key="${esc(e.key)}" ${idx===0?'disabled':''} aria-label="Move ${esc(label(t))} up">▲</button><button class="x" data-act="moveThread" data-d="1" data-key="${esc(e.key)}" ${idx===last?'disabled':''} aria-label="Move ${esc(label(t))} down">▼</button><button class="x" data-act="remove" data-key="${esc(e.key)}" aria-label="Remove ${esc(label(t))}">✕</button></div></li>`}).join(''):'<li class="hint">No threads yet. Tap swatches on the right to add what you own.</li>';
  const c=$('#ownCount');if(c)c.textContent=type.threads.length?`· ${type.threads.length}`:''}

/* ---------- chrome / routing ---------- */
function chrome(){
  $('#dirty').classList.toggle('on',dirty);$('#saveBtn').classList.toggle('pri',dirty);
  document.documentElement.dataset.theme=S.theme;
  $$('.themes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===S.theme));
  $('#typeChips').innerHTML=(S.types.length?'<span class="lbl">Yarn type</span>':'')+S.types.map(t=>`<button class="chip" data-act="type" data-id="${t.id}" aria-pressed="${t.id===(curType()||{}).id}">${esc(t.name)}<small>${t.threads.length}</small></button>`).join('')+`<button class="chip" data-act="tab" data-v="stash">${S.types.length?'＋':'＋ Add a yarn type'}</button>`;
  $$('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===ui.tab))}
function render(){chrome();const v=$('#view');
  v.innerHTML=ui.tab==='gen'?viewGen():ui.tab==='saved'?viewSaved():viewStash();
  if(ui.tab==='gen')renderResults();if(ui.tab==='stash'&&curType()){renderOwned();renderGrid()}}
$('.themes').innerHTML=['dark','mid','light'].map(t=>`<button data-act="theme" data-t="${t}" aria-label="${t} background"></button>`).join('');
$('.tabs').innerHTML=[['gen','Generate'],['stash','My threads'],['saved','Saved palettes']].map(([k,n])=>`<button role="tab" data-act="tab" data-v="${k}">${n}</button>`).join('');

/* ---------- actions ---------- */
const exInfo=type=>{const n=(type.excluded||[]).filter(k=>type.threads.some(e=>e.key===k)).length;return n?`${n} thread${n>1?'s':''} excluded. <button class="btn sm ghost" data-act="exClear">Include all</button>`:''};
function refreshStrip(){const type=curType(),ex=new Set(type.excluded||[]);
  $$('.btile').forEach(x=>{const k=x.dataset.key;x.classList.toggle('sel',k===ui.gen.baseKey);if(k)x.classList.toggle('ex',ex.has(k))});
  const i=$('#exInfo');if(i)i.innerHTML=exInfo(type)}
const tapT={k:null,t:0};
const A={
  tab:b=>{ui.tab=b.dataset.v;render();window.scrollTo(0,0)},
  type:b=>{ui.typeId=b.dataset.id;ui.result=null;ui.pal=null;ui.gen.baseKey='';render()},
  theme:b=>{S.theme=b.dataset.t;chrome()},
  harm:b=>{if(!ui.result)return;ui.sel=b.dataset.k;ui.pal=ui.result.pals[ui.sel];const sc=window.scrollY;renderResults();window.scrollTo(0,sc)},
  gmode:b=>{ui.gen.gmode=b.dataset.k;const y=$('#view');const sc=window.scrollY;render();window.scrollTo(0,sc)},
  base:b=>{const k=b.dataset.key,type=curType(),now=Date.now();
    if(k&&tapT.k===k&&now-tapT.t<400){tapT.k=null;const ex=type.excluded||(type.excluded=[]),i=ex.indexOf(k);
      if(i>=0)ex.splice(i,1);else{ex.push(k);if(ui.gen.baseKey===k)ui.gen.baseKey=''}
      mark();refreshStrip();return}
    tapT.k=k;tapT.t=now;if(k&&(type.excluded||[]).includes(k))return;
    ui.gen.baseKey=k;refreshStrip()},
  exClear:()=>{curType().excluded=[];mark();refreshStrip()},
  gen:()=>generate(),
  star:b=>{const p=REG.get(b.dataset.pid);if(!p)return;const s=sig(p),i=S.favorites.findIndex(f=>sig(f)===s);
    if(i>=0){S.favorites.splice(i,1);toast('Removed from saved')}else{S.favorites.push({...p,id:'f'+uid(),created:Date.now()});toast('Saved. Remember to save your stash file.')}
    mark();ui.tab==='saved'?render():renderResults()},
  prev:b=>{ui.pal=REG.get(b.dataset.pid);ui.tab==='gen'?renderResults():render();setTimeout(()=>$('#svgHost')?.scrollIntoView({behavior:'smooth',block:'center'}),30)},
  mix:b=>{const p=REG.get(b.dataset.pid);if(!p||p.slots.length<2)return;
    const idx=[...p.slots.keys()];let perm;do{perm=shuffle(idx)}while(perm.some((v,i)=>v===i));
    p.slots=perm.map(i=>p.slots[i]);ui.pal=p;if(S.favorites.includes(p))mark();
    const sc=window.scrollY;ui.tab==='gen'?renderResults():render();window.scrollTo(0,sc)},
  list:b=>{const p=REG.get(b.dataset.pid);if(p)showText('Palette list',paletteText(p))},
  jpg:b=>{const p=REG.get(b.dataset.pid);if(p)exportJPG(p)},
  loadSvg:()=>$('#svgIn').click(),
  sample:()=>{S.svg=null;mark();ui.tab==='gen'?renderResults():render()},
  src:b=>{ui.browse={src:b.dataset.k,group:'all',q:''};render()},
  toggle:b=>{const type=curType(),k=b.dataset.key,i=type.threads.findIndex(e=>e.key===k);
    if(i>=0)type.threads.splice(i,1);else type.threads.push({key:k,note:''});
    b.classList.toggle('on',i<0);b.setAttribute('aria-pressed',i<0);mark();renderOwned()},
  moveThread:b=>{const type=curType(),k=b.dataset.key,d=+b.dataset.d,i=type.threads.findIndex(e=>e.key===k),j=i+d;
    if(i<0||j<0||j>=type.threads.length)return;
    const [e]=type.threads.splice(i,1);type.threads.splice(j,0,e);mark();renderOwned();
    const pick=[...$$('[data-act=moveThread]')].filter(x=>x.dataset.key===k);
    (pick.find(x=>x.dataset.d===b.dataset.d&&!x.disabled)||pick.find(x=>!x.disabled)||pick[0])?.focus()},
  remove:b=>{const type=curType();type.threads=type.threads.filter(e=>e.key!==b.dataset.key);mark();renderOwned();renderGrid()},
  addType:()=>{const el=$('#newType'),n=el.value.trim();if(!n){toast('Type a name first, for example Size 10.');el.focus();return}
    const t={id:uid(),name:n,threads:[]};S.types.push(t);ui.typeId=t.id;ui.result=null;mark();render()},
  renameType:()=>{const t=curType(),n=prompt('Rename yarn type',t.name);if(n&&n.trim()){t.name=n.trim().slice(0,40);mark();render()}},
  moveType:b=>{const t=curType(),i=S.types.indexOf(t),j=i+(+b.dataset.d);if(j<0||j>=S.types.length)return;
    S.types.splice(i,1);S.types.splice(j,0,t);mark();const sc=window.scrollY;render();window.scrollTo(0,sc)},
  delType:()=>{const t=curType();if(!confirm(`Delete “${t.name}” and its ${t.threads.length} threads? Saved palettes for it are removed too.`))return;
    S.types=S.types.filter(x=>x.id!==t.id);S.favorites=S.favorites.filter(f=>f.typeId!==t.id);ui.typeId=null;ui.result=null;ui.pal=null;mark();render()},
  addCustom:()=>{const type=curType();if(!type){toast('Create a yarn type first.');return}
    const name=$('#cName').value.trim(),code=$('#cCode').value.trim();if(!name&&!code){toast('Give the thread a name or number.');return}
    const grad=$('#cKind').value==='grad',cnt=grad?+$('#cStops').value:1;
    const id=uid();S.custom.push({id,brand:$('#cBrand').value.trim(),code,name,metallic:$('#cMetal').checked,hexes:[...Array(cnt)].map((_,i)=>$('#cC'+i).value)});
    type.threads.push({key:'c:'+id,note:$('#cNote').value.trim()});mark();toast('Custom thread added');
    ['#cBrand','#cCode','#cName','#cNote'].forEach(s=>$(s).value='');renderOwned();renderGrid();chrome()},
  save:()=>{const data={app:'skein-palette',version:1,types:S.types,custom:S.custom,favorites:S.favorites,svg:S.svg,theme:S.theme};
    download(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}),'skein-stash.json');dirty=false;chrome();toast('Stash file saved')},
  load:()=>$('#fileIn').click(),
  dlgCopy:async()=>{const tx=$('#dlgTx');try{await navigator.clipboard.writeText(tx.value)}catch(e){tx.select();document.execCommand('copy')}toast('Copied')},
  dlgSave:()=>download(new Blob([$('#dlgTx').value],{type:'text/plain'}),'skein-palette.txt'),
  dlgClose:()=>$('#dlg').close()
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&A[b.dataset.act])A[b.dataset.act](b,e)});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.in==='count'){ui.gen.count=+t.value;$('#cntV').textContent=t.value}
  if(t.id==='q'){ui.browse.q=t.value;renderGrid()}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
  if(d.in==='grad')ui.gen.grad=t.checked;if(d.in==='metal')ui.gen.metal=t.checked;if(d.in==='jpgprev')ui.jpgPrev=t.checked;
  if(t.id==='grp'){ui.browse.group=t.value;renderGrid()}
  if(d.note){const en=curType().threads.find(x=>x.key===d.note);if(en){en.note=t.value;mark()}}
  if(t.id==='cKind'||t.id==='cStops'){const g=$('#cKind').value==='grad',n=g?+$('#cStops').value:1;$('#cStopsW').style.display=g?'':'none';[0,1,2,3].forEach(i=>$('#cC'+i).style.display=i<n?'':'none')}
  if(t.id==='fileIn'&&t.files[0]){const f=t.files[0];t.value='';
    if(dirty&&!confirm('You have unsaved changes. Loading a file replaces the current stash. Continue?'))return;
    f.text().then(tx=>{try{const d=JSON.parse(tx);if(!Array.isArray(d.types))throw 0;
      S={types:d.types,custom:d.custom||[],favorites:d.favorites||[],svg:d.svg||null,theme:d.theme||S.theme};TC.clear();REG.clear();
      ui.typeId=null;ui.result=null;ui.pal=null;ui.gen.baseKey='';dirty=false;ui.tab=S.types.length?'gen':'stash';render();toast('Stash loaded')}catch(err){toast('That file is not a Skein stash.')}})}
  if(t.id==='svgIn'&&t.files[0]){const f=t.files[0];t.value='';f.text().then(tx=>{if(!paintSVG(tx,{slots:[{key:'dmc:310'}]})){toast('That SVG could not be read.');return}
    S.svg=tx;const nc=svgColorCount(tx);if(nc>=2){ui.gen.count=Math.min(8,nc)}mark();render();toast(nc?`SVG loaded: ${nc} color groups found`+(nc>8?' (palettes max out at 8)':', color count set to '+Math.min(8,Math.max(2,nc))):'SVG loaded (no color groups found, fills are replaced in order)')})}});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
ui.tab='stash';render();
</script>
</body>
</html>
