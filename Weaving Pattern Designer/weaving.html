<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weaving Pattern Designer</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf7f2;--fg:#2b2622;--card:#fff;--line:#d9d0c4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--fg:#eee8df;--card:#292524;--line:#4a423b}}
:root[data-theme="dark"]{--bg:#1c1917;--fg:#eee8df;--card:#292524;--line:#4a423b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif;padding:16px}
main{max-width:900px;margin:0 auto}
h1{font-size:1.3rem;margin:0 0 12px}
h2{font-size:.85rem;margin:18px 0 6px;text-transform:uppercase;letter-spacing:.05em;opacity:.7}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.tools label{display:flex;align-items:center;gap:6px;font-size:.9rem}
input[type=color]{width:44px;height:36px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
input[type=number]{width:56px;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button{padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:.85rem}
#pal{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.sw.on{outline:3px solid var(--fg);outline-offset:1px}
.scroll{overflow-x:auto;padding:2px 0 4px}
.rows{display:grid;gap:6px;width:100%}
.row{display:grid}
.cell{aspect-ratio:1/1;margin:2px;border:1px solid rgba(128,128,128,.5);border-radius:5px;touch-action:none;cursor:pointer;user-select:none}
.sp{height:40px}
canvas{display:block;max-width:100%;border:1px solid var(--line);border-radius:6px}
small{opacity:.7;display:block;margin-top:8px}
.sw.add{border:2px dashed var(--fg);background:transparent;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;opacity:.7}
#dlgbg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:10}
#dlgbg[hidden]{display:none}
#dlg{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:240px}
#dlg input[type=color]{width:100%;height:80px}
#dlg .btns{display:flex;gap:8px;justify-content:flex-end}
#dlg .ok{background:var(--fg);color:var(--bg)}
#dmc{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
#dmc summary{cursor:pointer;font-size:.9rem}
#dmc .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
#dmc input[type=search]{flex:1;min-width:120px;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
#dmcg{display:flex;flex-wrap:wrap;gap:4px;max-height:190px;overflow:auto}
.dsw{width:30px;height:30px;border-radius:5px;border:1px solid rgba(128,128,128,.6);cursor:pointer;padding:0}
.dsw.on{outline:3px solid var(--fg);outline-offset:1px}
</style></head><body><main>
<h1>🧶 Weaving Pattern Designer</h1>
<div class="tools">
  <label>Cells in row A <input type="number" id="nw" min="2" max="30" value="12"></label>
  <label>Repeats <input type="number" id="nr" min="1" max="40" value="8"></label>
  <button id="fa">Fill A</button><button id="fb">Fill B</button>
  <button id="save">💾 Save pattern</button><button id="load">📂 Load pattern</button>
  <input type="file" id="file" accept=".json,application/json" hidden>
</div>
<small id="msg" aria-live="polite"></small>
<div id="pal"></div>
<details id="dmc"><summary>DMC thread colours <span id="dmcn">(not loaded)</span></summary>
  <div class="bar"><input type="search" id="dmcq" placeholder="Search code or name"><select id="dmcgrp"><option value="">All groups</option></select></div>
  <div id="dmcg"></div>
</details>
<small>Tap/drag to paint with the selected colour. Double-click (double-tap) a cell to choose a custom colour for it.</small>

<h2>Row A and row B (B is one cell longer, offset half a cell)</h2>
<div class="scroll"><div class="rows" id="rows"><div class="row" id="A"></div><div class="row" id="B"></div></div></div>

<div class="sp"></div>

<h2>Textile (A, B, A, B … repeated)</h2>
<canvas id="cv"></canvas>
<div id="dlgbg" hidden><div id="dlg" role="dialog" aria-modal="true"><strong id="dlgt">Choose a colour</strong><input type="color" id="dlgc" value="#c0392b"><div class="btns"><button id="dlgx">Cancel</button><button id="dlgok" class="ok">Apply</button></div></div></div>
</main>
<script>
let A=[],B=[],painting=false,last={k:null,t:0},dlg=null;
const $=id=>document.getElementById(id);
const pick={value:'#c0392b'},cv=$('cv'),ctx=cv.getContext('2d');
const base=['#c0392b','#e67e22','#f1c40f','#27ae60','#2c5f7c','#8e44ad','#f5e6c8','#2b2622'];
const pal=[...base];
function drawPal(){
  const p=$('pal');p.innerHTML='';
  pal.forEach(c=>{const d=document.createElement('div');d.className='sw'+(c.toLowerCase()===pick.value.toLowerCase()?' on':'');
    d.style.background=css(c);d.onclick=()=>{pick.value=c;drawPal()};p.appendChild(d)});
  const ad=document.createElement('div');ad.className='sw add';ad.textContent='+';ad.title='Add custom colour';
  ad.onclick=()=>openDlg('pal',pick.value,null);p.appendChild(ad);
  if(typeof drawDmc==='function')drawDmc();
}
function openDlg(mode,color,el){dlg={mode,el};$('dlgc').value=isG(color)?gStops(color)[0].c:color;$('dlgt').textContent=mode==='pal'?'Add a custom colour':'Colour for this cell';$('dlgbg').hidden=false}
function closeDlg(){dlg=null;$('dlgbg').hidden=true}
$('dlgx').onclick=closeDlg;
$('dlgbg').addEventListener('pointerdown',e=>{if(e.target.id==='dlgbg')closeDlg()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dlg)closeDlg()});
$('dlgok').onclick=()=>{
  if(!dlg)return;const c=$('dlgc').value;
  if(dlg.mode==='cell')setCell(dlg.el.dataset.t,+dlg.el.dataset.i,c,dlg.el);else pick.value=c;
  addPal(c);drawPal();closeDlg();
};
function addPal(c){if(!pal.some(x=>x.toLowerCase()===c.toLowerCase()))pal.push(c)}
const arr=id=>id==='A'?A:B;
function size(){
  const n=Math.max(2,Math.min(30,+$('nw').value||12));
  while(A.length<n)A.push(A.length%2?'#f5e6c8':'#2c5f7c');
  while(B.length<n+1)B.push(B.length%2?'#e67e22':'#c0392b');
  A.length=n;B.length=n+1;build();
}
function build(){
  const rw=$('rows');rw.style.minWidth=(B.length*26)+'px';rw.style.maxWidth=(B.length*44)+'px';
  ['A','B'].forEach(id=>{
    const a=arr(id),el=$(id);el.innerHTML='';
    el.style.gridTemplateColumns=`repeat(${2*B.length},1fr)`;
    a.forEach((c,i)=>{const d=document.createElement('div');d.className='cell';d.style.background=css(c);d.dataset.t=id;d.dataset.i=i;
      d.style.gridColumn=(id==='B'?2*i+1:2*i+2)+' / span 2';el.appendChild(d)});
  });
  draw();
}
function setCell(t,i,c,el){arr(t)[i]=c;el.style.background=css(c);draw()}
document.addEventListener('pointerdown',e=>{
  const el=e.target;if(!el.classList||!el.classList.contains('cell'))return;
  e.preventDefault();
  const k=el.dataset.t+el.dataset.i,now=Date.now();
  if(last.k===k&&now-last.t<400){ // double click/tap → custom colour
    painting=false;openDlg('cell',arr(el.dataset.t)[el.dataset.i],el);
    last={k:null,t:0};return;
  }
  last={k,t:now};painting=true;setCell(el.dataset.t,+el.dataset.i,pick.value,el);
});
document.addEventListener('pointermove',e=>{
  if(!painting)return;
  const el=document.elementFromPoint(e.clientX,e.clientY);
  if(el&&el.classList.contains('cell'))setCell(el.dataset.t,+el.dataset.i,pick.value,el);
});
document.addEventListener('pointerup',()=>painting=false);
function draw(){
  // elongated pointy-top hexagons (as in textile_tiling.svg): width w, straight sides 1.58w, caps .42w
  const n=A.length,reps=Math.max(1,Math.min(40,+$('nr').value||8));
  const w=Math.max(8,Math.min(30,Math.floor(860/(n+1)))),cap=.42*w,body=1.58*w,pitch=2*w;
  cv.width=(n+1)*w;cv.height=2*reps*pitch+cap+2;
  ctx.fillStyle=getComputedStyle(document.body).backgroundColor;ctx.fillRect(0,0,cv.width,cv.height);
  ctx.lineWidth=Math.max(.6,w/20);ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineJoin='round';
  const fillOf=(c,y)=>{
    if(!isG(c))return c;
    const g=ctx.createLinearGradient(0,y,0,y+body+2*cap);
    gStops(c).forEach(x=>g.addColorStop(Math.min(1,Math.max(0,x.p/100)),x.c));return g;
  };
  const hex=(cx,y,c)=>{
    ctx.beginPath();
    ctx.moveTo(cx,y);ctx.lineTo(cx+w/2,y+cap);ctx.lineTo(cx+w/2,y+cap+body);
    ctx.lineTo(cx,y+body+2*cap);ctx.lineTo(cx-w/2,y+cap+body);ctx.lineTo(cx-w/2,y+cap);ctx.closePath();
    ctx.fillStyle=fillOf(c,y);ctx.fill();
    const g=ctx.createLinearGradient(cx-w/2,0,cx+w/2,0);
    g.addColorStop(0,'rgba(0,0,0,.2)');g.addColorStop(.5,'rgba(255,255,255,.14)');g.addColorStop(1,'rgba(0,0,0,.2)');
    ctx.fillStyle=g;ctx.fill();ctx.stroke();
  };
  for(let r=0;r<reps;r++){
    A.forEach((c,i)=>hex(i*w+w,2*r*pitch+1,c));
    B.forEach((c,i)=>hex(i*w+w/2,(2*r+1)*pitch+1,c));
  }
}
$('nw').onchange=size;$('nr').onchange=draw;
$('fa').onclick=()=>{A.fill(pick.value);build()};
$('fb').onclick=()=>{B.fill(pick.value);build()};
const msg=t=>{$('msg').textContent=t};
$('save').onclick=async()=>{
  const data=JSON.stringify({app:'weaving-pattern',version:1,repeats:+$('nr').value||8,A,B},null,1);
  try{
    const d=await claude.use('downloads');
    if(!d){msg('Saving is not available in this view.');return}
    await d.save({filename:'weaving-pattern.json',data});msg('Pattern saved.');
  }catch(e){msg(e&&e.code==='declined'?'Save cancelled.':'Could not save: '+((e&&e.message)||e))}
};
$('load').onclick=()=>$('file').click();
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const p=JSON.parse(r.result),ok=x=>Array.isArray(x)&&x.length>0&&x.every(validColor);
      if(!ok(p.A)||!ok(p.B))throw new Error('not a weaving pattern');
      const n=Math.max(2,Math.min(30,p.A.length));
      A=p.A.slice(0,n);B=p.B.slice(0,n+1);
      while(A.length<n)A.push('#cccccc');while(B.length<n+1)B.push('#cccccc');
      $('nw').value=n;if(p.repeats)$('nr').value=Math.max(1,Math.min(40,+p.repeats||8));
      p.A.concat(p.B).forEach(addPal);drawPal();build();msg('Loaded '+f.name);
    }catch(err){msg('Could not load that file: '+err.message)}
  };
  r.readAsText(f);e.target.value='';
};
// ---- DMC colour database (JSON or CSV; columns detected automatically) ----
let dmc=[];
const isG=c=>c.startsWith('g:');
const gStops=c=>c.slice(2).split(',').map(x=>{const i=x.indexOf(':');return{p:+x.slice(0,i),c:x.slice(i+1)}});
const css=c=>isG(c)?'linear-gradient(to bottom,'+gStops(c).map(x=>x.c+' '+x.p+'%').join(',')+')':c;
const validColor=c=>typeof c==='string'&&(/^#[0-9a-f]{6}$/i.test(c)||/^g:\d+:#[0-9a-f]{6}(,\d+:#[0-9a-f]{6})*$/i.test(c));
function drawDmc(){
  const q=$('dmcq').value.toLowerCase().trim(),gp=$('dmcgrp').value,g=$('dmcg');g.innerHTML='';
  dmc.filter(c=>(!gp||c.group===gp)&&(!q||(c.code+' '+c.name).toLowerCase().includes(q))).slice(0,600).forEach(c=>{
    const b=document.createElement('button');b.className='dsw'+(c.hex===pick.value.toLowerCase()?' on':'');
    b.style.background=css(c.hex);b.title=('DMC '+c.code+' '+c.name+(c.group?' ['+c.group+']':'')).trim();b.setAttribute('aria-label',b.title);
    b.onclick=()=>{pick.value=c.hex;addPal(c.hex);drawPal();msg('Selected '+b.title+(isG(c.hex)?' (gradient)':' ('+c.hex+')'))};
    g.appendChild(b);
  });
}
function setDmc(list){
  dmc=list;$('dmcn').textContent='('+list.length+' colours)';
  const gs=[...new Set(list.map(c=>c.group).filter(Boolean))].sort(),sel=$('dmcgrp');
  sel.innerHTML='<option value="">All groups</option>'+gs.map(x=>'<option>'+x.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</option>').join('');
  drawDmc();
}
$('dmcq').oninput=drawDmc;$('dmcgrp').onchange=drawDmc;
// DMC colours from dmc_colors.json: solid colours are '#rrggbb'; gradients (variegated threads) are 'g:pos:#rrggbb,...'
const DMC_BUILTIN=[{"hex":"#fff7e7","code":"Ecru","name":"Ecru off-white","group":"Whites & Ecru"},{"hex":"#fcfcff","code":"Blanc","name":"","group":"Whites & Ecru"},{"hex":"#fcfcff","code":"White","name":"","group":"Whites & Ecru"},{"hex":"#ffffff","code":"B5200","name":"Snow White","group":"Whites & Ecru"},{"hex":"#efeef0","code":"1","name":"White Tin","group":"Whites & Ecru"},{"hex":"#c5c4c9","code":"2","name":"Tin","group":"Whites & Ecru"},{"hex":"#b0b0b5","code":"3","name":"Tin - Medium","group":"Grays"},{"hex":"#9c9b9d","code":"4","name":"Tin - Dark","group":"Grays"},{"hex":"#e3ccbe","code":"5","name":"Driftwood - Light","group":"Browns & Tans"},{"hex":"#dcc6b8","code":"6","name":"Driftwood - Medium Light","group":"Browns & Tans"},{"hex":"#ccb8aa","code":"7","name":"Driftwood","group":"Browns & Tans"},{"hex":"#9d7d71","code":"8","name":"Driftwood - Dark","group":"Browns & Tans"},{"hex":"#552014","code":"9","name":"Cocoa - Very Dark","group":"Mauves & Antique"},{"hex":"#edfed9","code":"10","name":"Tender Green - Very Light","group":"Greens"},{"hex":"#e2edb5","code":"11","name":"Tender Green - Light","group":"Greens"},{"hex":"#cdd99a","code":"12","name":"Tender Green","group":"Greens"},{"hex":"#bff6e0","code":"13","name":"Nile Green - Medium Light","group":"Teals & Turquoise"},{"hex":"#d0fbb2","code":"14","name":"Apple Green - Pale","group":"Greens"},{"hex":"#d1eda4","code":"15","name":"Apple Green","group":"Greens"},{"hex":"#a4d67c","code":"16","name":"Chartreuse - Light","group":"Greens"},{"hex":"#e5e272","code":"17","name":"Yellow Plum - Light","group":"Yellows"},{"hex":"#d9d56d","code":"18","name":"Yellow Plum","group":"Yellows"},{"hex":"#f7c95f","code":"19","name":"Autumn Gold - Medium Light","group":"Oranges"},{"hex":"#f7af93","code":"20","name":"Shrimp","group":"Corals & Salmons"},{"hex":"#d79982","code":"21","name":"Alizarian - Light","group":"Oranges"},{"hex":"#bc604e","code":"22","name":"Alizarian","group":"Oranges"},{"hex":"#ede2ed","code":"23","name":"Apple Blossom","group":"Whites & Ecru"},{"hex":"#e0d7ee","code":"24","name":"White Lavender","group":"Whites & Ecru"},{"hex":"#dad2e9","code":"25","name":"Lavender - Ultra Light","group":"Lavenders"},{"hex":"#cfc8de","code":"26","name":"Lavender - Pale","group":"Lavenders"},{"hex":"#e9ecfc","code":"27","name":"White Violet","group":"Whites & Ecru"},{"hex":"#7d4e92","code":"28","name":"Eggplant - Medium Light","group":"Purples & Violets"},{"hex":"#674076","code":"29","name":"Eggplant","group":"Purples & Violets"},{"hex":"#6d54d3","code":"30","name":"Blueberry - Medium Light","group":"Purples & Violets"},{"hex":"#5834a3","code":"31","name":"Blueberry","group":"Purples & Violets"},{"hex":"#4d2e8a","code":"32","name":"Blueberry - Dark","group":"Purples & Violets"},{"hex":"#d9539f","code":"33","name":"Fuchsia","group":"Purples & Violets"},{"hex":"#ae4280","code":"34","name":"Fuchsia - Dark","group":"Purples & Violets"},{"hex":"#732b55","code":"35","name":"Fuchsia - Very Dark","group":"Purples & Violets"},{"hex":"#cf0053","code":"150","name":"Red - Bright","group":"Reds"},{"hex":"#ffcbd7","code":"151","name":"Pink","group":"Pinks & Roses"},{"hex":"#e1a1a1","code":"152","name":"Tawny - Dark","group":"Mauves & Antique"},{"hex":"#eac5eb","code":"153","name":"Lilac","group":"Purples & Violets"},{"hex":"#4b233a","code":"154","name":"Red - Very Dark","group":"Reds"},{"hex":"#9774b6","code":"155","name":"Forget-me-not Blue","group":"Blues"},{"hex":"#8577b4","code":"156","name":"Blue - Medium","group":"Blues"},{"hex":"#b5b8ea","code":"157","name":"Blue - Light","group":"Blues"},{"hex":"#393068","code":"158","name":"Blue - Dark","group":"Blues"},{"hex":"#bcb5de","code":"159","name":"Petrol Blue - Light","group":"Blues"},{"hex":"#8178a9","code":"160","name":"Petrol Blue - Medium","group":"Blues"},{"hex":"#60568b","code":"161","name":"Petrol Blue - Dark","group":"Blues"},{"hex":"#cae7f0","code":"162","name":"Baby Blue - Light","group":"Blues"},{"hex":"#557a60","code":"163","name":
